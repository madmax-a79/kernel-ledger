name: append-only guard

# Fails when ledger.json loses its append-only history: any commit that edits, removes or
# reorders an existing line in entries, interventions, manipulation, amendments or audits, leaves
# the file invalid, or appends a line that breaks the ledger rules (the same rules as
# scripts/append.mjs). Every commit since the last one a finished run of this guard checked is
# covered, so pushes whose run was skipped or cancelled are caught by the next run or the daily one.
#
# The bot accounts are held to more: commits they push, as recorded in GitHub's push log, and
# commits they wrote (their git author or committer identity) whoever pushed them, each account to
# its own rules. KERNEL_ACTORS (Kernel) may append entries of any type except Controller checks;
# CONTROLLER_ACTORS (the Controller) may append only Controller checks; both may append manipulation
# attempts and add new receipt photos or PDFs, and neither may touch meta or any other file.
#
# Only main may exist. Every run of the guard fails while the repo has any other branch or tag, until
# it is deleted; the "bots push only to main" job also fails at once when a bot pushes one, but GitHub
# starts no run for some pushes (over three tags at once, or a ref whose commit carries an older
# workflow), so the guard's own check is the one that holds.
#
# In every run except a manual re-check (any push to main, the operator's too, and the daily run),
# the guard also puts back any file outside ledger.json and new receipts that a bot added, changed or
# deleted in commits it pushed itself, as the file was before the bot's first change to it, in a
# commit of its own as github-actions[bot]. A new receipt whose name differs only in case from
# another is removed too. It skips commits the operator has acknowledged (only lines a commit with no
# bot account appended acknowledge), and any file someone other than the guard, or the same bot in
# that run of commits, changed after the bot did (the operator sorts that out); it never touches
# ledger.json, and puts nothing back when it can't see every commit since the last passing run or who
# pushed each. A bot-written commit someone else pushed is flagged, not put back. The run still fails
# until the operator acknowledges the breach.
#
# The check is inline, not a script in the repo: GitHub refuses pushes that touch
# .github/workflows/ from a token without the "workflow" scope, so neither bot can weaken it.
# It reports after a push; main is also protected against force pushes and deletion.

on:
  push:
    branches: ['**']
    tags: ['**']
  schedule:
    - cron: '17 9 * * *' # daily, for pushes whose run never happened
  workflow_dispatch: # re-check the whole history from the first commit

permissions:
  contents: read
  actions: read

jobs:
  refs:
    name: bots push only to main
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check who pushed
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          BOTS: kernel-agent kernel-controller
        run: |
          node --input-type=module <<'JS'
          const { ACTOR = '', REF = '', BOTS = '' } = process.env;
          const bot = BOTS.split(/[\s,]+/).filter(Boolean).map((a) => a.toLowerCase()).includes(ACTOR.toLowerCase());
          const ref = JSON.stringify(REF.replace(/[\r\n]/g, ''));
          if (bot) {
            console.log(`::error title=bots push only to main::${ACTOR} pushed ${ref}; the bot accounts may push only to main`);
            process.exit(1);
          }
          console.log(`${ref} was pushed by an account other than the bots; nothing to check.`);
          JS

  guard:
    name: ledger.json is append-only
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Writes only to put back files a bot changed (see the top). Push and daily runs go one at a time, so restores
    # can't race; manual re-checks never write and have their own group.
    permissions:
      contents: write
      actions: read
    concurrency:
      group: append-only-guard-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit not yet checked
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          KERNEL_ACTORS: kernel-agent
          CONTROLLER_ACTORS: kernel-controller
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';

          const FILE = 'ledger.json';
          const MAX_DEPTH = 32;
          const WORKFLOW = 'append-only-guard.yml';
          const env = process.env;
          const problemsFound = []; // { commit, text }: commit is the full id the problem belongs to, or null
          const notes = [];
          // Positions in interventions of lines a bot account appended; they never acknowledge anything.
          const botInterventions = new Set();
          // Interventions lines as a commit with no bot account appended them, with their position then: the only lines
          // that acknowledge or retract, so a bot can't void an acknowledgement by breaking, emptying or editing the log.
          // Every line a bot commit added or changed is kept as written, and never counts as the operator's, even when
          // an operator commit (a revert, say) brings it back.
          const operatorLines = [];
          const botLines = [];
          const opLine = (i, x) => {
            if (botLines.some((b) => same(b, x))) return;
            if (!operatorLines.some(([j, y]) => j === i && same(x, y))) operatorLines.push([i, x]);
          };
          // Files a bot account put out of bounds: { commit, path, who, pushed }, in the order checked.
          const outOfBounds = [];
          // One entry per commit and text: a commit whose short id matches another's still gets its own entry.
          const flag = (commit, text) => { if (!problemsFound.some((p) => p.commit === commit && p.text === text)) problemsFound.push({ commit, text }); };

          // ---- Ledger rules. The same block is in scripts/append.mjs and in the append-only guard
          // ---- (.github/workflows/append-only-guard.yml); change both together.
          const ARRAYS = ['entries', 'interventions', 'manipulation', 'amendments', 'audits'];
          const TYPES = ['buy', 'sell', 'pass', 'correction', 'death', 'reload', 'note', 'check', 'earn'];
          const STATUSES = ['verified', 'flagged'];
          // Numbers the page does arithmetic with, and the lowest value each may take.
          const NUMBERS = { trade: 1, amount_cad: 0, fx_usd_per_cad: 0, amount_usd: 0, net_usd: -Infinity, est_value_usd: 0, fees_usd: 0, shipping_usd: 0, hours: 0, km: 0, price: 0, fee: 0, net: 0 };
          // What each log line on the page shows; without these the line renders blank.
          const LOG_FIELDS = { interventions: ['date', 'kind', 'detail'], manipulation: ['date', 'channel', 'summary'], amendments: ['version', 'date', 'summary'], audits: ['date', 'note'] };
          const ID = /^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$/;
          // Photos, screenshots and PDFs only: nothing a browser would run on the ledger's own site.
          const RECEIPT = /^receipts\/[A-Za-z0-9][A-Za-z0-9._-]*\.(jpe?g|png|webp|gif|heic|pdf)$/i;
          // Control characters other than tab, newline and carriage return, and bidirectional overrides.
          const HIDDEN = /[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u200e\u200f\u202a-\u202e\u2066-\u2069]/;
          // Line types whose net_usd moves cash on the page.
          const CASH_TYPES = ['buy', 'sell', 'correction', 'reload', 'earn'];
          // Rule 26: the only kinds of digital work Kernel may be paid for, in the constitution's words.
          const EARN_CATEGORIES = ['research and summaries', 'data cleanup', 'structured writing and editing', 'code and small automations', 'transcription and translation'];
          // Words that name the client; a key containing any of them, in any form (clientName, clientname, BUYER_EMAIL, CUSTOMERs),
          // is a client field.
          const CLIENT_WORDS = ['client', 'customer', 'buyer'];

          const isObject = (o) => o !== null && typeof o === 'object' && !Array.isArray(o);
          const text = (v) => typeof v === 'string' && v.trim() !== '';
          const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(Date.parse(s + 'T00:00:00Z')) && new Date(s + 'T00:00:00Z').toISOString().startsWith(s);
          const isUrl = (s) => typeof s === 'string' && /^https?:\/\/[^\s\\/?#]+\.[^\s\\/?#]+([/?#][^\s\\]*)?$/i.test(s);

          // Deep equality of parsed JSON; iterative, so no nesting can overflow the stack.
          function same(a, b) {
            const todo = [[a, b]];
            while (todo.length) {
              const [x, y] = todo.pop();
              if (x === y) continue;
              if (typeof x !== 'object' || typeof y !== 'object' || x === null || y === null || Array.isArray(x) !== Array.isArray(y)) return false;
              const kx = Object.keys(x);
              if (kx.length !== Object.keys(y).length) return false;
              for (const k of kx) {
                if (!Object.hasOwn(y, k)) return false;
                todo.push([x[k], y[k]]);
              }
            }
            return true;
          }

          // Every object key in a parsed value, at any depth; iterative.
          function keysDeep(v) {
            const keys = [], todo = [v];
            while (todo.length) {
              const x = todo.pop();
              if (x && typeof x === 'object') for (const [k, y] of Object.entries(x)) { if (!Array.isArray(x)) keys.push(k); todo.push(y); }
            }
            return keys;
          }
          // A key's letters alone: lookalike and fullwidth forms folded, accents and invisible characters dropped, lowercased.
          const flatKey = (k) => String(k).normalize('NFKD').replace(/[\p{M}\p{Default_Ignorable_Code_Point}]/gu, '').toLowerCase().replace(/[^a-z]/g, '');
          const clientKeys = (v) => [...new Set(keysDeep(v).filter((k) => CLIENT_WORDS.some((w) => flatKey(k).includes(w))))];

          // Nesting depth of a parsed value, and every string (keys included) in it; both iterative.
          function shape(v) {
            let depth = 0;
            const found = [], todo = [[v, 0]];
            while (todo.length) {
              const [x, d] = todo.pop();
              if (typeof x === 'string') found.push(x);
              else if (x && typeof x === 'object') {
                depth = Math.max(depth, d + 1);
                for (const [k, y] of Object.entries(x)) { if (!Array.isArray(x)) found.push(k); todo.push([y, d + 1]); }
              }
            }
            return { depth, strings: found };
          }

          // The calendar date in Vancouver, where the operator's clock runs, `days` from now.
          function vancouverDate(days = 0) {
            const p = {};
            new Intl.DateTimeFormat('en-US', { timeZone: 'America/Vancouver', year: 'numeric', month: '2-digit', day: '2-digit' })
              .formatToParts(new Date(Date.now() + days * 86400000)).forEach((x) => { p[x.type] = x.value; });
            return `${p.year}-${p.month}-${p.day}`;
          }

          // Everything wrong with appending obj to ledger[array]; empty when it may be appended.
          function problems(array, obj, ledger, latestDate) {
            const out = [];
            const say = (p) => out.push(p);
            if (!isObject(obj)) return ['it is not a JSON object'];
            const { depth } = shape(obj);
            if (depth > 8) return [`it is nested ${depth} levels deep; a ledger line needs at most 8`];
            const need = (k) => { if (!text(obj[k])) say(`missing "${k}" (text)`); };
            const meta = isObject(ledger.meta) ? ledger.meta : {};
            const items = ledger[array].filter(isObject);
            if (obj.id != null && !(typeof obj.id === 'string' && ID.test(obj.id))) say('"id" may use letters, digits, ".", "_" and "-" (at most 40), e.g. E001');

            if (array === 'entries') {
              ['id', 'type', 'date'].forEach(need);
              const byId = new Map(items.map((e) => [String(e.id).toLowerCase(), e]));
              const count = (t) => items.filter((e) => e.type === t).length;
              const lives = Number(meta.lives_total || 3), startUsd = Number(meta.start_usd || 10);
              const num = (k) => { if (typeof obj[k] !== 'number') say(`missing "${k}" (number)`); };
              const ref = (k, types) => {
                if (!text(obj[k])) { say(`missing "${k}"`); return null; }
                const e = byId.get(obj[k].toLowerCase());
                if (!e || e.id !== obj[k]) { say(`"${k}": no entry with id ${JSON.stringify(obj[k])}`); return null; }
                if (types && !types.includes(e.type)) { say(`"${k}": ${e.id} is a ${e.type}, not a ${types.join(' or ')}`); return null; }
                if (isDate(e.date) && isDate(obj.date) && obj.date < e.date) say(`dated before ${e.id} (${e.date}), which it refers to`);
                return e;
              };
              if (typeof obj.id === 'string' && byId.has(obj.id.toLowerCase())) say(`an entry with id ${JSON.stringify(byId.get(obj.id.toLowerCase()).id)} already exists`);
              if (text(obj.type) && !TYPES.includes(obj.type)) say(`"type" must be one of: ${TYPES.join(', ')}`);
              switch (obj.type) {
                case 'buy':
                  num('net_usd'); num('est_value_usd');
                  if (obj.net_usd > 0) say('a buy spends cash, so "net_usd" must be 0 or negative');
                  break;
                case 'sell': {
                  num('net_usd');
                  const buy = ref('closes', ['buy']);
                  if (buy && items.some((e) => e.type === 'sell' && e.closes === buy.id)) say(`"closes": ${buy.id} was already sold`);
                  break;
                }
                case 'correction': {
                  const target = ref('corrects');
                  if (target && obj.est_value_usd != null && (target.type !== 'buy' || items.some((e) => e.type === 'sell' && e.closes === target.id))) {
                    say(`"est_value_usd" re-marks a held item, but ${target.id} is not a buy that is still held`);
                  }
                  break;
                }
                case 'death':
                  if (count('death') > count('reload')) say('already dead: the next life starts with a reload');
                  if (count('death') >= lives) say(`all ${lives} lives are used`);
                  break;
                case 'reload':
                  if (obj.net_usd !== startUsd) say(`a reload carries "net_usd": ${startUsd}`);
                  if (count('reload') >= count('death')) say('a reload needs a death entry first');
                  if (count('death') >= lives) say(`all ${lives} lives are used`);
                  break;
                case 'earn': {
                  // Rule 26: pay for digital work from an agent marketplace, in fiat through escrow. price - fee = net, in the
                  // payout's currency; net_usd is what reached the challenge wallet; the payout receipt is a file.
                  need('marketplace');
                  if (!text(obj.category)) say(`missing "category" (one of: ${EARN_CATEGORIES.join('; ')})`);
                  else if (!EARN_CATEGORIES.includes(obj.category)) say(`"category" must be one of: ${EARN_CATEGORIES.join('; ')} (Rule 26)`);
                  if (obj.currency !== 'USD' && obj.currency !== 'CAD') say('"currency" is the payout\'s currency, "USD" or "CAD"');
                  ['price', 'fee', 'net', 'net_usd'].forEach(num);
                  const [price, fee, net, usd] = [obj.price, obj.fee, obj.net, obj.net_usd];
                  if (typeof usd === 'number' && !(usd > 0)) say('an earn adds cash, so "net_usd" must be more than 0');
                  if ([price, fee, net].every((v) => typeof v === 'number') && Math.abs(price - fee - net) > 0.005) say('"net" is "price" minus "fee"');
                  if (obj.currency === 'USD' && typeof net === 'number' && typeof usd === 'number' && Math.abs(net - usd) > 0.005) say('for a USD payout, "net_usd" equals "net"');
                  if (obj.currency === 'CAD') {
                    if (obj.fx_date == null) say('a CAD payout needs "fx_date", the date of the Bank of Canada rate it uses');
                    if (typeof obj.fx_usd_per_cad !== 'number') say('a CAD payout needs "fx_usd_per_cad", the Bank of Canada rate');
                    else if (typeof net === 'number' && typeof usd === 'number' && Math.abs(net * obj.fx_usd_per_cad - usd) > 0.01) say('for a CAD payout, "net_usd" is "net" times "fx_usd_per_cad", to the cent');
                  }
                  if (!(Array.isArray(obj.receipts) && obj.receipts.some((r) => typeof r === 'string' && RECEIPT.test(r)))) say('an earn needs its payout receipt, a receipts/ file, in "receipts"');
                  if (obj.trade != null) say('an earn is not a trade, so it carries no "trade"');
                  if (obj.est_value_usd != null) say('an earn holds nothing, so it carries no "est_value_usd"');
                  const named = clientKeys(obj);
                  if (named.length) say(`${named.map((k) => JSON.stringify(k)).join(', ')}: client identity is never published, so an earn line has no client, customer or buyer field at any depth (Rule 26)`);
                  break;
                }
                case 'check':
                  ref('checks', TYPES.filter((t) => t !== 'check'));
                  need('status');
                  if (text(obj.status) && !STATUSES.includes(obj.status)) say(`"status" must be one of: ${STATUSES.join(', ')}`);
                  break;
              }
              if (obj.net_usd != null && !CASH_TYPES.includes(obj.type)) say(`a ${obj.type} line does not move cash, so it cannot carry "net_usd"`);
              for (const [k, min] of Object.entries(NUMBERS)) {
                if (obj[k] == null) continue;
                if (typeof obj[k] !== 'number' || !Number.isFinite(obj[k])) say(`"${k}" must be a number`);
                else if (obj[k] < min) say(`"${k}" must be at least ${min}`);
              }
              const lastTrade = Math.max(0, ...items.map((e) => (Number.isInteger(e.trade) ? e.trade : 0)));
              if (obj.trade != null && !(Number.isInteger(obj.trade) && obj.trade <= lastTrade + 1)) say(`"trade" must be a whole number no higher than ${lastTrade + 1}`);
              if (obj.comps != null && !(Array.isArray(obj.comps) && obj.comps.every(isUrl))) say('"comps" must be a list of http(s) links');
              if (obj.listing != null && !isUrl(obj.listing)) say('"listing" must be an http(s) link');
              if (obj.memo != null && !isObject(obj.memo)) say('"memo" must be an object');
              // The Bank of Canada publishes no rate on weekends and holidays, so the rate can predate the line.
              if (obj.fx_date != null && !(isDate(obj.fx_date) && !(isDate(obj.date) && obj.fx_date > obj.date))) say('"fx_date" is the Bank of Canada date of the rate, written YYYY-MM-DD, on or before "date"');
              if (obj.fx_date != null && obj.fx_usd_per_cad == null) say('"fx_date" goes with "fx_usd_per_cad"');
              // A shipping quote as shown on Canada Post's public Find a Rate page (Rule 13); the origin is
              // recorded only to three characters, and Canadian destinations likewise.
              if (obj.shipping_quote != null) {
                const q = obj.shipping_quote;
                const bad = (m) => say(`"shipping_quote": ${m}`);
                if (!isObject(q)) bad('must be an object');
                else {
                  if (!(typeof q.rate_cad === 'number' && Number.isFinite(q.rate_cad) && q.rate_cad >= 0)) bad('"rate_cad" is the price shown on Find a Rate, as a number');
                  if (!text(q.service)) bad('"service" is the service name shown on Find a Rate');
                  if (q.quote_type !== 'counter') bad('"quote_type" is "counter", the public retail rate');
                  if (!(Number.isInteger(q.weight_g) && q.weight_g > 0 && q.weight_g <= 30000)) bad('"weight_g" is the parcel weight in whole grams, at most 30000');
                  if (!(Array.isArray(q.dims_cm) && q.dims_cm.length === 3 && q.dims_cm.every((d) => typeof d === 'number' && d > 0 && d <= 300))) bad('"dims_cm" is [length, width, height] in cm');
                  if (!(typeof q.origin_fsa === 'string' && /^[A-Z]\d[A-Z]$/.test(q.origin_fsa))) bad('"origin_fsa" is only the first three characters of the origin postal code, e.g. "V5L"');
                  if (!(typeof q.destination === 'string' && /^(CA [A-Z]\d[A-Z]|US \d{5}|(?!CA|US)[A-Z]{2})$/.test(q.destination))) bad('"destination" is "CA" and a postal-code prefix ("CA M5V"), "US" and a ZIP code ("US 90210"), or another two-letter country code');
                  if (!isDate(q.date) || (isDate(obj.date) && q.date > obj.date)) bad('"date" is the quote date, YYYY-MM-DD, on or before the line\'s date');
                }
                if (!(Array.isArray(obj.receipts) && obj.receipts.some((r) => typeof r === 'string' && RECEIPT.test(r)))) say('a line with "shipping_quote" needs its Find a Rate screenshot in "receipts"');
              }
              if (obj.receipts != null && !Array.isArray(obj.receipts)) say('"receipts" must be a list');
              else if (obj.receipts != null) {
                const seen = new Set();
                for (const r of obj.receipts) {
                  if (!isUrl(r) && !(typeof r === 'string' && RECEIPT.test(r))) say(`receipt ${JSON.stringify(r)} must be an http(s) link or receipts/<name> ending in .jpg, .jpeg, .png, .webp, .gif, .heic or .pdf, the name using only letters, digits, ".", "_" and "-"`);
                  else if (seen.has(String(r).toLowerCase())) say(`receipt ${JSON.stringify(r)} is listed twice (names are compared ignoring case)`);
                  seen.add(String(r).toLowerCase());
                }
              }
              if (isDate(obj.date) && isDate(meta.start_date) && obj.date < meta.start_date) say(`"date" is before the start date ${meta.start_date}`);
            } else if (obj.retracts != null) {
              // An operator line that retracts an earlier line of the same log, which stays visible, struck out.
              need('date'); need('reason');
              const target = Number.isInteger(obj.retracts) ? ledger[array][obj.retracts] : undefined;
              if (!isObject(target) || target.retracts != null) say(`"retracts" must be the position (0 = first) of an existing ${array} line`);
              else if (items.some((x) => x.retracts === obj.retracts)) say(`${array}[${obj.retracts}] is already retracted`);
              if (obj.acknowledges != null) say('a retraction acknowledges nothing; record a breach in its own line');
            } else {
              LOG_FIELDS[array].forEach(need);
              // A retracted line no longer holds its week or version.
              const retracted = new Set(items.map((x) => x.retracts).filter(Number.isInteger));
              const standing = ledger[array].filter((x, i) => isObject(x) && x.retracts == null && !retracted.has(i));
              if (array === 'amendments' && text(obj.version) && !/^\d+(\.\d+)*$/.test(obj.version)) say('"version" is written like "1.1", without a "v"');
              if (array === 'amendments' && standing.some((x) => String(x.version) === String(obj.version))) say(`amendment v${obj.version} already exists`);
              if (array === 'audits' && obj.week != null && !(Number.isInteger(obj.week) && obj.week >= 0)) say('"week" must be a whole number');
              else if (array === 'audits' && obj.week != null && standing.some((x) => x.week === obj.week)) say(`the audit note for week ${obj.week} already exists`);
              // One commit id, or a list of them when one breach spans several commits.
              if (array === 'interventions' && obj.acknowledges != null) {
                const ids = Array.isArray(obj.acknowledges) ? obj.acknowledges : [obj.acknowledges];
                if (!ids.length || !ids.every((c) => typeof c === 'string' && /^[0-9a-f]{40}$/.test(c))) say('"acknowledges" is the full 40-character id of the commit that broke the rules, or a list of such ids');
                else if (new Set(ids).size !== ids.length) say('"acknowledges" lists the same commit twice');
              }
              if (items.some((x) => same(x, obj))) say(`this exact line is already in ${array}`);
            }
            if (array !== 'entries' && obj.id != null && items.some((x) => x.id === obj.id)) say(`${array} already has id ${JSON.stringify(obj.id)}`);
            if (obj.date != null && !isDate(obj.date)) say('"date" must be a real date written YYYY-MM-DD');
            else if (isDate(obj.date) && obj.date > latestDate) say(`"date" ${obj.date} is in the future (latest allowed ${latestDate}, Vancouver time)`);
            for (const [k, v] of Object.entries(obj)) {
              const hit = [k, ...shape(v).strings].map((x) => HIDDEN.exec(x)).find(Boolean);
              if (hit) say(`"${k}" contains the invisible character U+${hit[0].codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}`);
            }
            return out;
          }
          // Duplicate keys per object (so a second "entries" can't hide behind the first) and nesting depth.
          function scan(src) {
            const stack = [], dups = [];
            let deepest = 0;
            for (let i = 0; i < src.length; i++) {
              const c = src[i];
              if (c === '"') {
                let j = i + 1;
                while (src[j] !== '"') j += src[j] === '\\' ? 2 : 1;
                let k = j + 1;
                while (/\s/.test(src[k])) k++;
                const top = stack[stack.length - 1];
                if (top && src[k] === ':') {
                  const key = JSON.parse(src.slice(i, j + 1));
                  if (top.has(key)) dups.push(key);
                  top.add(key);
                }
                i = j;
              } else if (c === '{' || c === '[') {
                stack.push(c === '{' ? new Set() : null);
                deepest = Math.max(deepest, stack.length);
              } else if (c === '}' || c === ']') stack.pop();
            }
            return { dups: [...new Set(dups)], deepest };
          }
          // ---- end of ledger rules

          process.env.GIT_LITERAL_PATHSPECS = '1'; // file names from bot commits are data: no pathspec magic or globs
          const git = (...args) => execFileSync('git', args, { maxBuffer: 1 << 28, stdio: ['ignore', 'pipe', 'pipe'] });
          const out = (...args) => git(...args).toString('utf8');
          const tryGit = (...args) => { try { return git(...args); } catch { return null; } };
          const short = (sha) => sha.slice(0, 7);
          // A file name as inert code in the summary, never Markdown or HTML.
          const inert = (s) => '`' + String(s).replace(/[`\r\n]/g, '') + '`';
          const hasCommit = (sha) => tryGit('cat-file', '-e', `${sha}^{commit}`) !== null;
          const isAncestor = (a, b) => tryGit('merge-base', '--is-ancestor', a, b) !== null;
          const revList = (range) => out('rev-list', '--reverse', '--topo-order', range).split('\n').filter(Boolean);
          // Ledger text is shown as inert code, never as Markdown or links.
          const label = (o) => '`' + String(o?.id ?? o?.version ?? (o?.week != null ? 'week ' + o.week : o?.date ?? '?')).replace(/[`\r\n]/g, '').slice(0, 40) + '`';
          // Bot accounts and the only lines each may append: Kernel its own entries (never Controller checks),
          // the Controller only its checks; both may log manipulation attempts.
          const list = (v) => (v || '').split(/[\s,]+/).filter(Boolean).map((a) => a.toLowerCase());
          const ROLES = { kernel: list(env.KERNEL_ACTORS), controller: list(env.CONTROLLER_ACTORS) };
          const roleOf = (who) => Object.keys(ROLES).find((r) => !!who && ROLES[r].includes(who.toLowerCase())) || null;
          const appendOnly = (who) => roleOf(who) !== null;

          // ledger.json at a commit: { missing } | { error } | { data, error? }. A ledger that parses but
          // breaks a rule keeps its data, so what later commits do to it is still checked.
          const cache = new Map();
          function load(sha) {
            if (!cache.has(sha)) cache.set(sha, parse(tryGit('cat-file', 'blob', `${sha}:${FILE}`)));
            return cache.get(sha);
          }
          function parse(buf) {
            if (buf == null) return { missing: true };
            let src, data;
            try { src = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { return { error: 'is not valid UTF-8' }; }
            try { data = JSON.parse(src); } catch (e) { return { error: `is not valid JSON (${e.message})` }; }
            if (!isObject(data)) return { error: 'top level is not an object' };
            const bad = ARRAYS.filter((k) => !Array.isArray(data[k]));
            if (bad.length) return { error: `has ${bad.map((k) => `"${k}"`).join(', ')} missing or not an array` };
            const { dups, deepest } = scan(src);
            if (dups.length) return { data, error: `has duplicate keys: ${dups.map((k) => JSON.stringify(k)).join(', ')}` };
            if (deepest > MAX_DEPTH) return { data, error: `is nested more than ${MAX_DEPTH} levels deep` };
            return { data };
          }

          const parentsOf = (sha) => out('rev-list', '--parents', '-n', '1', sha).trim().split(' ').slice(1);

          // Nearest commit at or above sha whose ledger parses, following first parents.
          function lastGood(sha) {
            for (let s = sha; s; s = parentsOf(s)[0]) {
              const l = load(s);
              if (l.data) return l.data;
            }
            return null;
          }

          // Existing objects must stay where they are, unchanged. Returns false if any moved.
          function compare(before, after, c, merge) {
            let ok = true;
            for (const k of ARRAYS) {
              const old = before[k], cur = after[k];
              const changed = old.map((o, i) => i >= cur.length || !same(o, cur[i]));
              const bad = changed.indexOf(true);
              if (bad < 0) continue;
              ok = false;
              const more = changed.filter(Boolean).length - 1;
              flag(c, `${short(c)}: ${k}[${bad}] ${label(old[bad])} ${bad >= cur.length ? 'was removed' : 'was modified or moved'}`
                + (more > 0 ? ` (and ${more} more existing ${k} lines)` : '')
                + (merge ? ' in a merge; append-only needs a linear main, so rebase instead of merging' : ''));
            }
            return ok;
          }

          // Each appended line must follow the ledger rules, checked against the ledger as it stood
          // before it, and name only receipt files that are in the commit; each bot account may append
          // only its own kinds of line.
          function checkAppended(before, after, c, who) {
            const soFar = { ...after };
            for (const k of ARRAYS) soFar[k] = before[k].slice();
            // One day of slack over the script's "today": the check can run on a machine whose clock is a little ahead.
            const latest = vancouverDate(1);
            for (const k of ARRAYS) {
              for (const o of after[k].slice(before[k].length)) {
                const bad = problems(k, o, soFar, latest);
                if (bad.length) flag(c, `${short(c)}: appended ${k} line ${label(o)}: ${bad.join('; ')}`);
                if (k === 'entries' && isObject(o) && Array.isArray(o.receipts)) {
                  for (const r of o.receipts.filter((x) => typeof x === 'string' && RECEIPT.test(x))) {
                    if (!/^100644 blob /.test(out('ls-tree', c, '--', r))) flag(c, `${short(c)}: ${label(o)} names receipt ${JSON.stringify(r)}, which is not a file in this commit`);
                  }
                }
                // Every bot account involved (who pushed it, who wrote it) is held to its own rules.
                const roles = [].concat(who).map((w) => [w, roleOf(w)]).filter(([, r]) => r);
                for (const [w, role] of roles) {
                  if (!['entries', 'manipulation'].includes(k)) flag(c, `${short(c)}: ${w} may not append to ${k}`);
                  else if (k === 'entries' && isObject(o) && role === 'kernel' && o.type === 'check') flag(c, `${short(c)}: ${w} may not append Controller checks (${label(o)})`);
                  else if (k === 'entries' && isObject(o) && role === 'controller' && o.type !== 'check') flag(c, `${short(c)}: ${w} may append only Controller checks, not a ${JSON.stringify(String(o.type))} line (${label(o)})`);
                  if (isObject(o) && o.retracts != null) flag(c, `${short(c)}: ${w} may not retract lines`);
                }
                if (roles.length && k === 'interventions') botInterventions.add(soFar[k].length);
                if (!roles.length && k === 'interventions') opLine(soFar[k].length, o);
                soFar[k].push(o);
              }
            }
          }

          // The bot accounts that wrote a commit, by its git author and committer: the account's name, or its GitHub
          // no-reply address (login@users.noreply.github.com, or id+login@...).
          function botIdentities(c) {
            const f = out('log', '-1', '--format=%an%x00%ae%x00%cn%x00%ce', c).replace(/\n$/, '').split('\0');
            const found = new Set();
            for (const [name, email] of [[f[0], f[1]], [f[2], f[3]]]) {
              const m = /^(?:\d+\+)?([^@\s]+)@users\.noreply\.github\.com$/i.exec(email || '');
              for (const login of [m?.[1], name]) if (login && roleOf(login)) found.add(login.toLowerCase());
            }
            return [...found];
          }

          // What a bot account may change in one commit: append to ledger.json, add new receipt files.
          // pushed: the bot pushed it itself, so the guard may put its out-of-bounds files back.
          function checkFiles(c, parents, cur, who, pushed) {
            if (cur.data) {
              for (const p of parents) {
                const base = lastGood(p);
                if (!base) continue;
                for (const k of new Set([...Object.keys(base), ...Object.keys(cur.data)])) {
                  if (!ARRAYS.includes(k) && !same(base[k], cur.data[k])) flag(c, `${short(c)}: ${who} may not change "${k}" in ${FILE}`);
                }
              }
            }
            const taken = new Set(parents.length ? out('ls-tree', '-r', '--name-only', parents[0], '--', 'receipts/').split('\n').filter(Boolean).map((p) => p.toLowerCase()) : []);
            const raw = out('diff-tree', '-r', '-m', '--root', '--no-commit-id', '--no-renames', '--raw', '-z', c).split('\0');
            for (let i = 0; i + 1 < raw.length; i += 2) {
              const m = /^:\d{6} (\d{6}) [0-9a-f]+ [0-9a-f]+ ([A-Z])/.exec(raw[i]);
              if (!m) continue;
              const [, mode, status] = m, path = raw[i + 1];
              const ok = mode === '100644' && ((path === FILE && status === 'M') || (status === 'A' && RECEIPT.test(path)));
              const verb = { A: 'added', D: 'deleted', M: 'modified', T: 'changed the type of' }[status] || 'changed';
              if (!ok) {
                flag(c, `${short(c)}: ${who} may only append to ${FILE} and add new receipts/ photos or PDFs, but ${verb} ${JSON.stringify(path)}${mode !== '100644' && status !== 'D' ? ` as mode ${mode}` : ''}`);
                outOfBounds.push({ commit: c, path, who, pushed });
              } else if (status === 'A' && taken.has(path.toLowerCase())) {
                flag(c, `${short(c)}: ${JSON.stringify(path)} differs only in case from another receipt`);
                outOfBounds.push({ commit: c, path, who, pushed });
              } else if (path !== FILE) outOfBounds.push({ commit: c, path, who, pushed, inBounds: true }); // may continue a chain, never start one
              if (status === 'A') taken.add(path.toLowerCase());
            }
          }

          const API = env.GH_TOKEN && env.REPO ? `https://api.github.com/repos/${env.REPO}/` : null;
          async function api(path, pages = 1) {
            const items = [];
            let url = API + path;
            for (let n = 0; url && n < pages; n++) {
              const r = await fetch(url, { headers: { authorization: `Bearer ${env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' } });
              if (!r.ok) throw new Error(`GitHub API answered ${r.status} for ${path.split('?')[0]}`);
              const body = await r.json();
              items.push(...(Array.isArray(body) ? body : body.workflow_runs || []));
              url = /<([^>]+)>;\s*rel="next"/.exec(r.headers.get('link') || '')?.[1];
            }
            return items;
          }

          // Puts back files a bot account pushed out of bounds, in one commit on top of main. A file a bot changed in an
          // unbroken run of its own pushed commits goes back to how it was before the first of them. Skips ledger.json;
          // commits the operator has acknowledged, in the ledger this run checked or on main now; files already back;
          // and files anyone but this guard changed after the bot did (those are the operator's to sort out).
          function restoreFiles(acknowledged) {
            // A path's entry at a commit, or null when it is absent or a folder (a folder's files come back one by one).
            const entry = (sha, p) => { if (!sha) return null; const m = /^(\d{6}) [a-z]+ ([0-9a-f]+)\t/.exec(out('ls-tree', '-z', sha, '--', p)); return m && m[1] !== '040000' ? { mode: m[1], id: m[2] } : null; };
            const sameEntry = (x, y) => (x?.id ?? null) === (y?.id ?? null) && (x?.mode ?? null) === (y?.mode ?? null);
            const chains = new Map(); // path -> { first, last, commits }
            for (const x of outOfBounds) {
              if (!x.pushed || x.path === FILE || acknowledged.has(x.commit)) continue;
              const c = chains.get(x.path), par = parentsOf(x.commit)[0] || null;
              // A later bot commit continues the run only if no commit between the two touched the file.
              if (c && par && sameEntry(entry(par, x.path), entry(c.last.commit, x.path)) && !out('rev-list', '--full-history', `${c.last.commit}..${par}`, '--', x.path).trim()) { c.last = x; c.commits.push(x.commit); }
              else if (!x.inBounds) chains.set(x.path, { first: x, last: x, commits: [x.commit] });
            }
            // The bot's own unacknowledged commits, which don't count as someone else changing a file after it.
            const ours = new Set(outOfBounds.filter((x) => x.pushed && !acknowledged.has(x.commit)).map((x) => x.commit));
            if (!chains.size) return;
            const remote = env.RESTORE_REMOTE || (API ? `https://github.com/${env.REPO}.git` : null);
            if (!remote) { notes.push('Not running on GitHub, so no files were put back.'); return; }
            const auth = env.RESTORE_REMOTE ? [] : ['-c', `http.https://github.com/.extraheader=AUTHORIZATION: basic ${Buffer.from('x-access-token:' + env.GH_TOKEN).toString('base64')}`];
            const ident = { GIT_AUTHOR_NAME: 'github-actions[bot]', GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com', GIT_COMMITTER_NAME: 'github-actions[bot]', GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com' };
            for (let attempt = 0; attempt < 3; attempt++) {
              git(...auth, 'fetch', '--quiet', remote, '+refs/heads/main:refs/guard/main');
              const tip = out('rev-parse', 'refs/guard/main').trim();
              // Acknowledgements on main now count too: the operator may have acknowledged after the commit checked.
              const tipIvs = parse(tryGit('cat-file', 'blob', `${tip}:${FILE}`)).data?.interventions || [];
              const tipRetracted = new Set(tipIvs.filter(isObject).map((x) => x.retracts).filter(Number.isInteger));
              const ackNow = new Set(tipIvs.flatMap((x, i) => (isObject(x) && x.retracts == null && !tipRetracted.has(i) && !botInterventions.has(i) ? [].concat(x.acknowledges) : [])));
              const todo = [], kept = [];
              for (const [p, ch] of chains) {
                if (ch.commits.some((c) => ackNow.has(c))) continue;
                if (p.includes('\uFFFD')) { kept.push(`${inert(p)} (its name is not valid UTF-8; put it back by hand)`); continue; }
                const before = parentsOf(ch.first.commit)[0] || null;
                const want = entry(before, p);
                const now = entry(tip, p);
                if (sameEntry(now, want)) continue;
                const since = out('log', '--full-history', '--format=%H %an', `${ch.last.commit}..${tip}`, '--', p).split('\n').filter((l) => l && !ours.has(l.slice(0, 40)) && l.slice(41) !== ident.GIT_AUTHOR_NAME);
                if (since.length || !sameEntry(now, entry(ch.last.commit, p))) { kept.push(`${inert(p)} (changed again after ${short(ch.last.commit)})`); continue; }
                todo.push({ p, x: ch.first, want });
              }
              // A receipt coming back while another that differs only in case is on main would collide: leave it.
              const tipReceipts = out('ls-tree', '-r', '--name-only', '-z', tip, '--', 'receipts/').split('\0').filter(Boolean);
              const gone = new Set(todo.filter((t) => !t.want).map((t) => t.p));
              for (const t of todo.filter((t) => t.want && t.p.startsWith('receipts/'))) {
                const twin = tipReceipts.find((q) => q !== t.p && !gone.has(q) && q.toLowerCase() === t.p.toLowerCase());
                if (twin) { todo.splice(todo.indexOf(t), 1); kept.push(`${inert(t.p)} (${inert(twin)}, which differs only in case, is on main now)`); }
              }
              const index = join(env.RUNNER_TEMP || tmpdir(), `guard-index-${process.pid}-${attempt}`);
              const g = (...args) => execFileSync('git', args, { env: { ...process.env, ...ident, GIT_INDEX_FILE: index }, maxBuffer: 1 << 28, stdio: ['ignore', 'pipe', 'pipe'] }).toString('utf8');
              let commit = null;
              const put = [];
              try {
                if (todo.length) {
                  g('read-tree', tip);
                  // Removals first, so a path a bot turned from a file into a folder (or back) is clear before it returns.
                  for (const t of [...todo.filter((t) => !t.want), ...todo.filter((t) => t.want)]) {
                    try {
                      if (t.want) g('update-index', '--add', '--cacheinfo', t.want.mode, t.want.id, t.p);
                      else g('update-index', '--force-remove', '--', t.p);
                      put.push(t);
                    } catch { kept.push(`${inert(t.p)} (could not be put back in place)`); }
                  }
                  const tree = put.length ? g('write-tree').trim() : null;
                  if (tree && tree !== out('rev-parse', `${tip}^{tree}`).trim()) {
                    const msg = ['Put back files a bot account may not add, change or delete', '',
                      ...put.map((t) => `${t.p}: as before ${t.x.commit} (${t.x.who})`), '',
                      'The append-only guard made this commit. The guard keeps failing until the operator acknowledges the breach in the interventions log.'].join('\n');
                    commit = g('commit-tree', tree, '-p', tip, '-m', msg).trim();
                  }
                }
              } finally { rmSync(index, { force: true }); }
              const pushedOk = !commit || tryGit(...auth, 'push', '--quiet', remote, `${commit}:refs/heads/main`) !== null;
              if (pushedOk) {
                for (const k of kept) notes.push(`Not put back, so the operator must look at it: ${k}.`);
                if (commit) notes.push(`Put back ${put.map((t) => inert(t.p)).join(', ')} as before the bot's first change, in ${short(commit)}.`);
                return;
              }
            }
            flag(null, 'Could not push the commit that puts back the files a bot changed (main kept moving); run this check again.');
          }

          // Refs other than main, which only a bot pushing past this guard would have made: flagged on every run until
          // deleted, since a push GitHub starts no run for (over three tags at once, or a ref whose commit carries an
          // older workflow) is otherwise never seen.
          function checkRefs() {
            const remote = env.RESTORE_REMOTE || (API ? `https://github.com/${env.REPO}.git` : null);
            if (!remote) return;
            const refs = out('ls-remote', '--heads', '--tags', remote).split('\n').filter(Boolean).map((l) => l.split('\t')[1]);
            for (const r of refs) if (r !== 'refs/heads/main') flag(null, `The repo has ${JSON.stringify(r)}; only main may exist, and the bots may push only to it. Delete it.`);
          }

          async function run() {
            const after = env.AFTER || out('rev-parse', 'HEAD').trim();
            const manual = env.EVENT === 'workflow_dispatch';
            let before = /^[0-9a-f]{40}$/.test(env.BEFORE || '') && !/^0+$/.test(env.BEFORE) ? env.BEFORE : null;
            if (before && (env.FORCED === 'true' || !hasCommit(before) || !isAncestor(before, after))) {
              flag(null, `History was rewritten: ${short(before)} is no longer in main's history (force push). Past ledger states must stay in history.`);
              before = null;
            }

            // Start from the newest commit an earlier run of this guard passed, so pushes whose run was
            // skipped, cancelled, deleted or failed are checked again until they pass or are acknowledged.
            let base = before, from = before ? `${short(before)}, the previous tip` : 'the first commit';
            // The restore needs every commit since the last passing run and who pushed each; otherwise a run of bot
            // commits could be seen from its middle.
            let complete = true;
            if (manual) {
              base = null;
              from = 'the first commit (manual re-check)';
            } else if (API) {
              try {
                const runs = await api(`actions/workflows/${WORKFLOW}/runs?branch=main&status=success&per_page=100`);
                const last = runs.find((r) => String(r.id) !== env.RUN_ID && r.conclusion === 'success' && hasCommit(r.head_sha) && isAncestor(r.head_sha, after));
                base = last ? last.head_sha : null;
                from = last ? `${short(base)}, the last commit a passing guard run covered` : 'the first commit (no earlier passing run)';
              } catch (e) {
                flag(null, `Could not list earlier guard runs (${e.message}); run this check again.`);
                complete = false;
              }
            } else {
              notes.push('Not running on GitHub, so earlier runs and the push log were not consulted.');
            }
            const commits = revList(base ? `${base}..${after}` : after);
            const inRange = new Set(commits);
            if (base) (lastGood(base)?.interventions || []).forEach((x, i) => opLine(i, x));

            // Who pushed each commit: this push's actor, and GitHub's push log for any earlier push in range.
            const pusher = new Map();
            if (env.EVENT === 'push') revList(before ? `${before}..${after}` : after).forEach((c) => pusher.set(c, env.ACTOR));
            if (API && commits.some((c) => !pusher.has(c))) {
              try {
                for (const a of await api('activity?ref=refs%2Fheads%2Fmain&per_page=100', 10)) {
                  if (!inRange.has(a.after)) continue;
                  const who = a.actor?.login || '?';
                  if (['force_push', 'branch_deletion'].includes(a.activity_type)) flag(a.after, `main had a ${a.activity_type.replace('_', ' ')} by ${who} at ${a.timestamp}`);
                  const range = /^0+$/.test(a.before) || !hasCommit(a.before) ? a.after : `${a.before}..${a.after}`;
                  if (hasCommit(a.after)) revList(range).forEach((c) => { if (!pusher.has(c)) pusher.set(c, who); });
                }
              } catch (e) {
                if (manual) notes.push(`Could not read the push log (${e.message}).`);
                else flag(null, `Could not read the push log (${e.message}); run this check again.`);
                complete = false;
              }
            }
            // A commit nobody can be named for gets no benefit of the doubt, except in a manual re-check of
            // old history, which may be older than the push log.
            const unknown = API ? commits.filter((c) => !pusher.has(c)) : [];
            if (unknown.length) complete = false;
            if (unknown.length && manual) notes.push(`${unknown.length} older commit(s) are not in GitHub's push log, so account rules were applied only to those a bot account wrote.`);
            else unknown.forEach((c) => flag(c, `${short(c)}: not in GitHub's push log, so it is unclear who pushed it; run this check again, or look at it by hand`));

            const byBot = new Map(); // commit -> the bot account whose rules applied to it
            for (const c of commits) {
              const cur = load(c);
              const parents = parentsOf(c);
              const pushed = appendOnly(pusher.get(c));
              const bots = [...new Set([...(pushed ? [pusher.get(c).toLowerCase()] : []), ...botIdentities(c)])];
              const who = bots.length ? bots : pusher.get(c);
              if (bots.length) { byBot.set(c, bots.join(' + ')); checkFiles(c, parents, cur, bots.join(' + '), pushed); }
              // Every interventions line a bot commit adds or changes is the bot's, even when the commit also edits old lines.
              if (bots.length && cur.data) for (const p of parents.length ? parents : [null]) {
                const pi = (p && lastGood(p)?.interventions) || [];
                cur.data.interventions.forEach((x, i) => { if (i >= pi.length || !same(pi[i], x)) { botInterventions.add(i); botLines.push(x); } });
              }
              // A commit with no bot account owns the new lines it appends, even when it also puts back an old line a bot
              // edited (checkAppended is skipped then); not a line its parent already had or a bot wrote.
              if (!bots.length && cur.data) for (const p of parents) {
                const pi = lastGood(p)?.interventions;
                if (pi) cur.data.interventions.slice(pi.length).forEach((x, j) => { if (!pi.some((y) => same(x, y))) opLine(pi.length + j, x); });
              }
              if (cur.missing) {
                if (parents.some((p) => lastGood(p))) flag(c, `${short(c)}: ${FILE} was deleted`);
                continue;
              }
              if (cur.error) flag(c, `${short(c)}: ${FILE} ${cur.error}`);
              if (!cur.data) continue;
              if (!parents.length) checkAppended(Object.fromEntries(ARRAYS.map((k) => [k, []])), cur.data, c, who);
              for (const p of parents) {
                const prev = lastGood(p);
                if (prev && compare(prev, cur.data, c, parents.length > 1)) checkAppended(prev, cur.data, c, who);
              }
            }

            // Problems in a commit the operator has acknowledged in an intervention line stay on record here
            // as notes instead of failing every run. Only standing lines that a commit with no bot account
            // appended count, as they were appended: not a retracted line, not a retraction, and nothing a bot
            // wrote; a bot editing or deleting such a line later changes nothing.
            const head = load(after);
            // A retraction takes back the operator line that stood at its position when the retraction was appended.
            const retracted = new Set();
            operatorLines.forEach(([, x], n) => { if (isObject(x) && Number.isInteger(x.retracts)) { const t = operatorLines.slice(0, n).findLastIndex(([j]) => j === x.retracts); if (t >= 0) retracted.add(t); } });
            const acknowledged = new Set(operatorLines.flatMap(([, x], n) => (isObject(x) && x.retracts == null && !retracted.has(n) ? [].concat(x.acknowledges) : []))
              .filter((c) => typeof c === 'string' && /^[0-9a-f]{40}$/.test(c)));
            for (const p of problemsFound.filter((x) => x.commit && acknowledged.has(x.commit))) {
              notes.push(`Acknowledged in the interventions log: ${inert(p.text)}`);
              problemsFound.splice(problemsFound.indexOf(p), 1);
            }
            if (!manual && !complete) notes.push('Nothing was put back: this run could not see every commit since the last passing run, or who pushed each one. The next complete run will.');
            else if (!manual) {
              try { restoreFiles(acknowledged); } catch (e) { flag(null, `Could not put back the files a bot changed: ${String(e?.message || e).split('\n')[0]}`); }
            }
            try { checkRefs(); } catch (e) { flag(null, `Could not list the repo's branches and tags: ${String(e?.message || e).split('\n')[0]}`); }

            const start = base ? lastGood(base) : null;
            const lines = [`Checked ${commits.length} commit(s) from ${from} up to ${short(after)}.`];
            const kernel = [...new Set(byBot.values())];
            if (kernel.length) lines.push(`Account rules applied to commits by ${kernel.join(', ')}.`);
            const written = [...byBot].filter(([c]) => pusher.has(c) && !appendOnly(pusher.get(c)));
            if (written.length) lines.push(`Of those, written by a bot but pushed by someone else: ${written.map(([c, w]) => `${short(c)} (${w}, pushed by ${pusher.get(c)})`).join(', ')}.`);
            const unnamed = [...byBot].filter(([c]) => !pusher.has(c));
            if (unnamed.length) lines.push(`Of those, written by a bot but not in the push log, so who pushed them is unknown: ${unnamed.map(([c, w]) => `${short(c)} (${w})`).join(', ')}.`);
            if (head.data) {
              for (const k of ARRAYS) {
                const added = head.data[k].slice(start ? start[k].length : 0);
                if (added.length) lines.push(`- ${k}: +${added.length} (${added.slice(0, 20).map(label).join(', ')}${added.length > 20 ? ', ...' : ''})`);
              }
            }
            return lines;
          }

          let lines = [];
          try { lines = await run(); } catch (e) { flag(null, `The guard itself failed: ${String(e?.message || e).split('\n')[0]}`); }

          const esc = (s) => s.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const errors = problemsFound.map((p) => p.text);
          for (const e of errors) console.log(`::error title=append-only guard::${esc(e)}`);
          const fence = (s) => s.replace(/```/g, "'''");
          const summary = ['## append-only guard', errors.length ? `**Failed** (${errors.length})` : '**Passed**', '',
            ...(errors.length ? ['```text', ...errors.map(fence), '```', ''] : []),
            ...lines, ...notes.map((n) => `> ${fence(n)}`)].join('\n');
          console.log(summary);
          if (env.GITHUB_STEP_SUMMARY) appendFileSync(env.GITHUB_STEP_SUMMARY, summary + '\n');
          process.exit(errors.length ? 1 : 0);
          JS
